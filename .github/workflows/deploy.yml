# Auto-deploy to Alibaba Cloud on push to master
name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avz --delete --exclude='.git*' --exclude='.github'
          path: ./
          remote_path: /var/www/lianping-website/
          remote_host: ${{ secrets.ALIYUN_HOST }}
          remote_user: ${{ secrets.ALIYUN_USER }}
          remote_key: ${{ secrets.ALIYUN_SSH_KEY }}

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
